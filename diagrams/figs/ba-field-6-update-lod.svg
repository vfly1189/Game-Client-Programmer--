<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650">
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6270"/></marker>
  </defs>
  <rect width="1200" height="650" fill="#fff"/>
  <text x="40" y="46" class="h1">갱신 LOD — 화면 밖에서 가만히 있는 몬스터는 덜 돌린다</text>
  <text x="40" y="78" class="s m">존재 판정(⑤ 거리)이 '누구를 켤지'를 정했다면, 갱신 LOD는 켜 둔 몬스터를 '얼마나 자주 돌릴지'를 정한다</text>

  <!-- 왼쪽 : 판정 흐름 -->
  <rect x="40" y="104" width="360" height="520" rx="14" class="panel"/>
  <text x="60" y="136" class="h3">몬스터마다 매 프레임 판정</text>
  <rect x="60" y="154" width="320" height="44" rx="8" class="card"/>
  <text x="220" y="182" class="s mid">살아 있는 몬스터 (SpawnerManager)</text>
  <path d="M160 198 V222" class="ln-m" marker-end="url(#a6)"/>
  <rect x="60" y="224" width="200" height="44" rx="22" class="p-blue"/>
  <text x="160" y="252" class="s mid b">화면 밖인가?</text>
  <path d="M260 246 H290" class="ln-m" marker-end="url(#a6)"/><text x="275" y="238" class="xs m mid">아니오</text>
  <rect x="292" y="226" width="88" height="40" rx="8" class="card"/><text x="336" y="252" class="s mid">정상</text>
  <path d="M160 268 V298" class="ln-m" marker-end="url(#a6)"/><text x="172" y="288" class="xs m">예</text>
  <rect x="60" y="300" width="200" height="44" rx="22" class="p-blue"/>
  <text x="160" y="328" class="s mid b">교전 중인가?</text>
  <path d="M260 322 H290" class="ln-m" marker-end="url(#a6)"/><text x="275" y="314" class="xs m mid">예</text>
  <rect x="292" y="302" width="88" height="40" rx="8" class="card"/><text x="336" y="328" class="s mid">정상</text>
  <text x="336" y="362" class="xs m mid">공격 타이밍 유지</text>
  <path d="M160 344 V384" class="ln-m" marker-end="url(#a6)"/><text x="150" y="370" class="xs m end">아니오</text>
  <rect x="60" y="386" width="320" height="172" rx="12" class="p-orange"/>
  <text x="80" y="416" class="h3 c-orange">줄임 (Reduced)</text>
  <text x="80" y="450" class="s">HP바</text><text x="360" y="450" class="s end b">끔</text>
  <line x1="80" y1="464" x2="360" y2="464" stroke="#ffd8a8"/>
  <text x="80" y="492" class="s">행동 트리</text><text x="360" y="492" class="s end b">8프레임에 1번</text>
  <line x1="80" y1="506" x2="360" y2="506" stroke="#ffd8a8"/>
  <text x="80" y="534" class="s">Animator</text><text x="360" y="534" class="s end b">끔 (자세가 굳음)</text>
  <text x="60" y="598" class="s">살아 있는 몬스터의 <tspan class="b c-red">87%</tspan>가 화면 밖</text>

  <!-- 가운데 : 실행 프레임 -->
  <rect x="420" y="104" width="340" height="520" rx="14" class="panel"/>
  <text x="440" y="136" class="h3">행동 트리가 도는 프레임</text>
  <text x="440" y="160" class="xs m">interval 8 · 몬스터마다 phase를 엇갈림</text>
  <g class="xs m">
    <text x="507" y="190" class="mid">0</text><text x="567" y="190" class="mid">4</text><text x="627" y="190" class="mid">8</text><text x="687" y="190" class="mid">12</text><text x="732" y="190" class="mid">15</text>
  </g>
  <g fill="#fff" stroke="#dee2e6">
    <rect x="500" y="200" width="240" height="24"/><rect x="500" y="232" width="240" height="24"/>
    <rect x="500" y="264" width="240" height="24"/><rect x="500" y="296" width="240" height="24"/>
    <rect x="500" y="342" width="240" height="24"/>
  </g>
  <g stroke="#eef0f4"><path d="M515 200 V320 M530 200 V320 M545 200 V320 M560 200 V320 M575 200 V320 M590 200 V320 M605 200 V320 M620 200 V320 M635 200 V320 M650 200 V320 M665 200 V320 M680 200 V320 M695 200 V320 M710 200 V320 M725 200 V320"/></g>
  <g fill="#e8590c">
    <rect x="500" y="200" width="15" height="24"/><rect x="620" y="200" width="15" height="24"/>
    <rect x="605" y="232" width="15" height="24"/><rect x="725" y="232" width="15" height="24"/>
    <rect x="590" y="264" width="15" height="24"/><rect x="710" y="264" width="15" height="24"/>
    <rect x="575" y="296" width="15" height="24"/><rect x="695" y="296" width="15" height="24"/>
  </g>
  <rect x="500" y="342" width="240" height="24" fill="#3b5bdb"/>
  <g class="xs">
    <text x="440" y="217">몹 A · 0</text><text x="440" y="249">몹 B · 1</text><text x="440" y="281">몹 C · 2</text><text x="440" y="313">몹 D · 3</text>
    <text x="440" y="359">교전 중</text>
  </g>
  <text x="440" y="398" class="xs m">(frameCount + phase) % 8 == 0 일 때만 Tick</text>
  <text x="440" y="418" class="xs m">→ 줄인 몬스터의 판단이 한 프레임에 몰리지 않는다</text>
  <rect x="440" y="440" width="300" height="164" rx="10" class="card"/>
  <text x="456" y="468" class="s b">되돌리는 규칙</text>
  <text x="456" y="498" class="xs">• 화면 안에 들어오거나 교전하면 즉시 정상</text>
  <text x="456" y="524" class="xs">• 풀에서 다시 꺼낼 때(OnSpawn) 원래대로</text>
  <text x="456" y="550" class="xs">• Animator를 다시 켤 때 상태를 보존해</text>
  <text x="468" y="572" class="xs">등장 연출이 다시 재생되지 않게</text>

  <!-- 오른쪽 : 차트 -->
  <rect x="780" y="104" width="380" height="520" rx="14" class="panel"/>
  <text x="800" y="136" class="h3">몬스터 밀도별 보통 프레임 (ms)</text>
  <rect x="920" y="150" width="14" height="14" fill="#e8590c"/><text x="940" y="162" class="xs">LOD 끔</text>
  <rect x="1010" y="150" width="14" height="14" fill="#3b5bdb"/><text x="1030" y="162" class="xs">LOD 켬</text>
  <g stroke="#e9ecef"><path d="M812 450 H1144 M812 394 H1144 M812 338 H1144 M812 282 H1144 M812 226 H1144"/></g>
  <g class="xs m end"><text x="806" y="454">0</text><text x="806" y="398">1</text><text x="806" y="342">2</text><text x="806" y="286">3</text><text x="806" y="230">4</text></g>
  <g>
    <rect x="822" y="368.2" width="28" height="81.8" fill="#e8590c"/><rect x="854" y="368.8" width="28" height="81.2" fill="#3b5bdb"/>
    <rect x="902" y="352" width="28" height="98" fill="#e8590c"/><rect x="934" y="354.8" width="28" height="95.2" fill="#3b5bdb"/>
    <rect x="982" y="313.4" width="28" height="136.6" fill="#e8590c"/><rect x="1014" y="326.8" width="28" height="123.2" fill="#3b5bdb"/>
    <rect x="1062" y="219.3" width="28" height="230.7" fill="#e8590c"/><rect x="1094" y="257.9" width="28" height="192.1" fill="#3b5bdb"/>
  </g>
  <g class="mid" style="font-size:11px">
    <text x="836" y="362">1.46</text><text x="868" y="362">1.45</text>
    <text x="916" y="346">1.75</text><text x="948" y="348">1.70</text>
    <text x="996" y="307">2.44</text><text x="1028" y="320">2.20</text>
    <text x="1076" y="213">4.12</text><text x="1108" y="251">3.43</text>
    
  </g>
  <g class="xs m mid">
    <text x="852" y="472">×1</text><text x="852" y="490">27마리</text>
    <text x="932" y="472">×2</text><text x="932" y="490">54마리</text>
    <text x="1012" y="472">×4</text><text x="1012" y="490">107마리</text>
    <text x="1092" y="472">×8</text><text x="1092" y="490">216마리</text>
  </g>
  <rect x="800" y="510" width="166" height="94" rx="10" class="card"/>
  <text x="883" y="536" class="xs m mid">보통 프레임 (×8)</text>
  <text x="883" y="566" class="h3 mid">4.12 → <tspan class="c-blue">3.43ms</tspan></text>
  <text x="883" y="590" class="s c-green mid b">▼17%</text>
  <rect x="976" y="510" width="166" height="94" rx="10" class="card"/>
  <text x="1059" y="536" class="xs m mid">144fps 예산 안 몬스터 (×8)</text>
  <text x="1059" y="566" class="h3 mid">430 → <tspan class="c-blue">514마리</tspan></text>
  <text x="1059" y="590" class="s c-green mid b">약 1.2배</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660">
  <rect width="1200" height="660" fill="#fff"/>
  <text x="40" y="46" class="h1">기존 AbilitySystem — 흐름까지 부품으로 만들어서, 분기가 생길 때마다 새 클래스가 필요했다</text>
  <text x="40" y="78" class="s m">공격을 Effect(SO) 목록으로 조립하고 러너가 순서대로 await 한다. 플레이어 스킬(선형)에는 맞았지만, 선택 · 분기가 있는 보스 패턴에서 막혔다</text>

  <!-- 왼쪽 : 선형 Effect 목록 -->
  <rect x="40" y="104" width="420" height="530" rx="14" class="panel"/>
  <text x="62" y="138" class="h3">AbilityData = Effect 목록 (선형) · 구성 예</text>
  <rect x="62" y="156" width="376" height="58" rx="8" class="card"/>
  <text x="80" y="181" class="xs mono m">AbilityRunner</text>
  <text x="80" y="202" class="xs mono">foreach (effect) await effect.ExecuteAsync(ctx)</text>
  <g>
    <rect x="62" y="232" width="376" height="40" rx="8" fill="#4f74c9"/><text x="80" y="258" class="s w">DelayEffect</text><text x="420" y="258" class="xs w end">흐름</text>
    <rect x="62" y="280" width="376" height="96" rx="8" fill="#4f74c9"/><text x="80" y="306" class="s w">RepeatEffect (count 8 · 0.05초)</text><text x="420" y="306" class="xs w end">흐름</text>
    <rect x="82" y="318" width="340" height="44" rx="6" fill="#e8590c"/><text x="98" y="346" class="s w">SpawnProjectiles</text><text x="404" y="346" class="xs w end">행동</text>
    <rect x="62" y="384" width="376" height="40" rx="8" fill="#e8590c"/><text x="80" y="410" class="s w">ApplyStatusTag</text><text x="420" y="410" class="xs w end">행동</text>
  </g>
  <rect x="62" y="446" width="376" height="164" rx="10" class="p-green"/>
  <text x="80" y="476" class="s b c-green">플레이어 스킬에는 잘 맞았다</text>
  <text x="80" y="504" class="xs">• 발동 3갈래(플레이어 · 몹 · 보스)를 러너 하나로 모음</text>
  <text x="80" y="528" class="xs">• 몹 5연사 ↔ 히나 8연사 = 값만 다르고 코드 차이 0줄</text>
  <text x="80" y="552" class="xs">• 하지만 Delay · Repeat 같은 <tspan class="b">흐름도 부품</tspan>이고,</text>
  <text x="92" y="576" class="xs">흐름은 순서대로 await 하는 <tspan class="b">한 줄</tspan>뿐 — 분기가 없다</text>

  <!-- 오른쪽 : 보스 유물 포격 -->
  <rect x="480" y="104" width="680" height="530" rx="14" class="panel"/>
  <text x="502" y="138" class="h3">보스 '유물 포격'을 같은 방식으로 담으면 — 트리가 곧 코드</text>
  <rect x="502" y="160" width="190" height="40" rx="8" class="card"/><text x="597" y="186" class="s mid b">Attack_Ability</text>
  <path d="M520 200 V226 M520 226 H534" class="ln-m"/>
  <rect x="534" y="208" width="232" height="38" rx="8" fill="#4f74c9"/><text x="550" y="233" class="s w">SelectRandomChoice</text>
  <path d="M520 226 V276 M520 276 H534" class="ln-m"/>
  <rect x="534" y="258" width="232" height="38" rx="8" fill="#4f74c9"/><text x="550" y="283" class="s w">BranchByChoice</text>
  <path d="M552 296 V330 M552 330 H566 M552 330 V430 M552 430 H566" class="ln-m"/>
  <rect x="566" y="312" width="200" height="36" rx="8" fill="#2b8a3e"/><text x="580" y="336" class="s w">빨강 → Scatter (안쪽)</text>
  <rect x="586" y="356" width="86" height="32" rx="6" fill="#e8590c"/><text x="629" y="377" class="xs w mid">SpawnVFX</text>
  <rect x="680" y="356" width="86" height="32" rx="6" fill="#e8590c"/><text x="723" y="377" class="xs w mid">AreaStrike</text>
  <rect x="566" y="412" width="200" height="36" rx="8" fill="#2b8a3e"/><text x="580" y="436" class="s w">초록 → Scatter (바깥)</text>
  <rect x="586" y="456" width="86" height="32" rx="6" fill="#e8590c"/><text x="629" y="477" class="xs w mid">SpawnVFX</text>
  <rect x="680" y="456" width="86" height="32" rx="6" fill="#e8590c"/><text x="723" y="477" class="xs w mid">AreaStrike</text>
  <rect x="502" y="510" width="264" height="100" rx="8" class="card"/>
  <text x="518" y="536" class="xs b c-red">고른 색은 어디에?</text>
  <text x="518" y="560" class="xs">부품은 결과를 저장할 수 없어서</text>
  <text x="518" y="582" class="xs">부품 밖 <tspan class="mono">BossRelicController</tspan>가</text>
  <text x="518" y="602" class="xs"><tspan class="mono">IChoiceHandler</tspan>로 들고 있었다</text>
  <text x="796" y="340" class="h1 m">=</text>
  <rect x="826" y="160" width="314" height="236" rx="10" fill="#1a1c22"/>
  <text x="846" y="192" class="xs mono" style="fill:#a5d8ff">void Attack() {</text>
  <text x="862" y="220" class="xs mono" style="fill:#ffc078">  color = Random(Red, Green);</text>
  <text x="862" y="248" class="xs mono" style="fill:#fff">  if (color == Red)</text>
  <text x="878" y="276" class="xs mono" style="fill:#fff">    for (inner 8)  { VFX(); Hit(); }</text>
  <text x="862" y="304" class="xs mono" style="fill:#fff">  else</text>
  <text x="878" y="332" class="xs mono" style="fill:#fff">    for (outer 70) { VFX(); Hit(); }</text>
  <text x="846" y="360" class="xs mono" style="fill:#a5d8ff">}</text>
  <text x="846" y="384" class="xs m" style="fill:#adb5bd">→ 블록 코딩 : 키워드 하나 = 부품 클래스 하나</text>
  <rect x="826" y="414" width="314" height="92" rx="10" class="p-red"/>
  <text x="842" y="442" class="s b c-red">① 분기 종류마다 새 부품</text>
  <text x="842" y="466" class="xs">랜덤 선택 · 조건 분기 · 산포 ·</text>
  <text x="842" y="488" class="xs">방사 … 새 흐름이 생길 때마다 클래스 추가</text>
  <rect x="826" y="518" width="314" height="92" rx="10" class="p-red"/>
  <text x="842" y="546" class="s b c-red">② 분기 결과를 둘 곳이 없다</text>
  <text x="842" y="570" class="xs">고른 색 · 경고 위치 같은 값이</text>
  <text x="842" y="592" class="xs">부품 밖 컨트롤러로 새어 나간다</text>
</svg>

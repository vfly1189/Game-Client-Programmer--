<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#fff"/>
  <text x="40" y="46" class="h1">수명 스코프 4종 — 수명 경계가 곧 해제 시점</text>
  <text x="40" y="78" class="s m">로드할 때 스코프를 고르면 끝. 스코프가 사라지는 순간, 그 스코프가 쥔 키만 refCount −1 → 0이 된 키만 Addressables.Release</text>

  <!-- 시간축 -->
  <g class="xs m mid">
    <text x="250" y="122">Start</text><text x="430" y="122">GameScene</text><text x="640" y="122">팝업 열기 → 닫기</text>
    <text x="860" y="122">BossDungeon</text><text x="1060" y="122">GameScene</text>
  </g>
  <path d="M180 132 H1160" stroke="#adb5bd" stroke-width="1.4"/>
  <g stroke="#ced4da" stroke-dasharray="4 4"><path d="M330 132 V 412 M780 132 V412 M960 132 V412 M560 132 V412 M720 132 V412"/></g>
  <!-- 행 -->
  <g>
    <text x="40" y="172" class="s b">Global</text><text x="40" y="192" class="xs m">앱 종료까지</text>
    <rect x="180" y="156" width="980" height="36" rx="6" fill="#4f74c9"/>
    <text x="200" y="179" class="xs w">SceneTable · 공용 이펙트 · 토스트 UI</text>

    <text x="40" y="238" class="s b">Scene</text><text x="40" y="258" class="xs m">씬 전환까지</text>
    <rect x="180" y="222" width="146" height="36" rx="6" fill="#748ffc"/>
    <rect x="334" y="222" width="442" height="36" rx="6" fill="#748ffc"/>
    <rect x="784" y="222" width="172" height="36" rx="6" fill="#748ffc"/>
    <rect x="964" y="222" width="196" height="36" rx="6" fill="#748ffc"/>
    <text x="350" y="245" class="xs w">씬 UI · 맵 · 팝업 프리팹 · 슬롯</text>

    <text x="40" y="304" class="s b">Party</text><text x="40" y="324" class="xs m">씬 전환을 넘어</text>
    <rect x="360" y="288" width="800" height="36" rx="6" fill="#2b8a3e"/>
    <text x="376" y="311" class="xs w">캐릭터 인게임 프리팹 · 스킬 아이콘 · 엠블럼 아틀라스 (파티가 바뀔 때 교체)</text>

    <text x="40" y="370" class="s b">Popup</text><text x="40" y="390" class="xs m">팝업 스택 0 → 1 ~ 1 → 0</text>
    <rect x="560" y="354" width="160" height="36" rx="6" fill="#6741d9"/>
    <text x="640" y="377" class="xs w mid">스탠딩 · 데코</text>
  </g>
  <!-- 해제 표시 -->
  <g fill="#e03131">
    <circle cx="330" cy="240" r="7"/><circle cx="780" cy="240" r="7"/><circle cx="960" cy="240" r="7"/><circle cx="720" cy="372" r="7"/>
  </g>
  <text x="1160" y="436" class="xs c-red end">● = 스코프 Dispose 지점 (호출부가 Release를 부르지 않는다)</text>

  <!-- 레지스트리 정산 -->
  <text x="40" y="482" class="h3">팝업을 모두 닫는 순간 — ResourceRegistry 정산</text>
  <g>
    <rect x="40" y="496" width="540" height="176" rx="10" class="card"/>
    <text x="60" y="524" class="xs m b">닫기 전</text>
    <g class="xs">
      <text x="60" y="552" class="b">키</text><text x="130" y="552" class="b">쥔 스코프</text><text x="380" y="552" class="b">ref</text><text x="440" y="552" class="b">상태</text>
      <text x="60" y="582">A</text><text x="130" y="582">Global · Scene</text><text x="380" y="582">2</text><text x="440" y="582">유지</text>
      <text x="60" y="610">B</text><text x="130" y="610">Scene · <tspan class="c-purple b">Popup</tspan></text><text x="380" y="610">2</text><text x="440" y="610">유지</text>
      <text x="60" y="638">C</text><text x="130" y="638"><tspan class="c-purple b">Popup</tspan></text><text x="380" y="638">1</text><text x="440" y="638">유지</text>
    </g>
    <text x="600" y="590" class="h1 m mid">→</text>
    <rect x="620" y="496" width="540" height="176" rx="10" class="card"/>
    <text x="640" y="524" class="xs m b">닫은 뒤 — Popup 스코프 소멸, 자기가 쥔 B · C만 −1</text>
    <g class="xs">
      <text x="640" y="552" class="b">키</text><text x="710" y="552" class="b">쥔 스코프</text><text x="960" y="552" class="b">ref</text><text x="1020" y="552" class="b">상태</text>
      <text x="640" y="582">A</text><text x="710" y="582">Global · Scene</text><text x="960" y="582">2</text><text x="1020" y="582" class="m">변화 없음</text>
      <text x="640" y="610">B</text><text x="710" y="610">Scene</text><text x="960" y="610">1</text><text x="1020" y="610" class="c-blue b">아직 주인 있음</text>
      <rect x="632" y="620" width="520" height="28" rx="4" fill="#fff0f0"/>
      <text x="640" y="638">C</text><text x="710" y="638" class="m">(없음)</text><text x="960" y="638" class="b c-red">0</text><text x="1020" y="638" class="c-red b">→ Release</text>
    </g>
  </g>
</svg>

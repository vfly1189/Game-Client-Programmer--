<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640">
  <rect width="1200" height="640" fill="#fff"/>
  <text x="40" y="46" class="h1">⑤ 거리 기반 활성화 — 켜기 20m / 끄기 25m 히스테리시스</text>
  <text x="40" y="78" class="s m">구역 없이 스포너 중심과 플레이어의 바닥(x · z) 거리만 본다. 판정선을 두 개로 나눠, 그 사이에서는 이전 상태를 유지한다</text>

  <!-- 왼쪽 : 반경 -->
  <rect x="40" y="104" width="500" height="510" rx="14" class="panel"/>
  <circle cx="290" cy="372" r="190" fill="#f1f3f5" stroke="#3b5bdb" stroke-width="1.6" stroke-dasharray="7 5"/>
  <circle cx="290" cy="372" r="152" fill="#dbe4ff" stroke="#3b5bdb" stroke-width="2"/>
  <circle cx="290" cy="372" r="12" fill="#1f3a5f"/>
  <text x="290" y="404" class="xs c-navy mid b">플레이어</text>
  <text x="340" y="174" class="s c-blue mid b">끄기 반경 25m</text>
  <text x="290" y="244" class="s c-blue mid b">켜기 반경 20m</text>
  <!-- 스포너 -->
  <circle cx="220" cy="330" r="9" fill="#e8590c"/>
  <text x="220" y="312" class="xs mid b c-orange">켜짐</text>
  <circle cx="170" cy="250" r="9" fill="#e8590c"/>
  <circle cx="410" cy="502" r="9" fill="none" stroke="#868e96" stroke-width="2.4"/>
  <line x1="120" y1="164" x2="164" y2="240" stroke="#495057" stroke-width="1.2"/>
  <text x="58" y="136" class="xs b" style="fill:#495057">20~25m 사이 : 이전 상태 유지</text>
  <text x="58" y="156" class="xs m">● 켜진 채 유지   ○ 꺼진 채 유지</text>
  <circle cx="500" cy="160" r="9" fill="none" stroke="#868e96" stroke-width="2.4"/>
  <text x="498" y="138" class="xs m end">25m 밖 : 꺼짐</text>
  <text x="62" y="596" class="xs m">거리는 x · z 평면에서 제곱으로 비교 (sqrt 없음)</text>

  <!-- 오른쪽 : 경계 왕복 -->
  <rect x="560" y="104" width="600" height="510" rx="14" class="panel"/>
  <text x="584" y="138" class="h3">플레이어가 켜기 반경 근처에서 1m씩 왕복하면</text>
  <text x="600" y="206" class="xs m">스포너까지 거리 ↕</text>
  <line x1="600" y1="165" x2="1120" y2="165" stroke="#3b5bdb" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="1120" y="158" class="xs c-blue end">끄기 25m</text>
  <line x1="600" y1="240" x2="1120" y2="240" stroke="#3b5bdb" stroke-width="1.6"/>
  <text x="1120" y="276" class="xs c-blue end">켜기 20m</text>

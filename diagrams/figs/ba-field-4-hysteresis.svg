  <text x="584" y="372" class="s b">켜기 20m / 끄기 25m로 나누면</text>
  <rect x="600" y="382" width="35.1" height="30" fill="#dee2e6"/>
  <rect x="635.1" y="382" width="484.9" height="30" fill="#3b5bdb"/>
  <rect x="584" y="432" width="270" height="62" rx="10" class="p-red"/>
  <text x="600" y="458" class="s c-red b">경계를 넘을 때마다 켜졌다 꺼짐</text>
  <text x="600" y="482" class="xs">① Sector 왕복 떨림 136회 · 스폰 몰림</text>
  <rect x="866" y="432" width="270" height="62" rx="10" class="p-green"/>
  <text x="882" y="458" class="s c-green b">한 번 켜지면 25m까지 유지</text>
  <text x="882" y="482" class="xs">⑤ 거리 왕복 떨림 0회</text>
  <rect x="584" y="512" width="552" height="82" rx="10" fill="#1a1c22"/>
  <text x="604" y="542" class="xs mono" style="fill:#a5d8ff">// DistanceActivation — 켜져 있으면 끄기 반경, 꺼져 있으면 켜기 반경</text>
  <text x="604" y="570" class="xs mono" style="fill:#fff">float r = current.Contains(id) ? _offRadiusSqr : _onRadiusSqr;</text>
  <text x="604" y="588" class="xs mono" style="fill:#fff">return dx * dx + dz * dz &lt;= r;</text>
  <text x="1120" y="306" class="xs m end">파랑 = 켜짐 · 회색 = 꺼짐</text>
</svg>
  <text x="584" y="306" class="s b">판정선이 하나(20m)라면</text>
  <rect x="600.0" y="316" width="35.1" height="30" fill="#dee2e6"/>
  <rect x="635.1" y="316" width="43.3" height="30" fill="#3b5bdb"/>
  <rect x="678.4" y="316" width="43.3" height="30" fill="#dee2e6"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <marker id="r3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6270"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#fff"/>
  <text x="40" y="46" class="h1">Addressables가 이미 참조를 세는데, 왜 스코프 층을 하나 더 두었나</text>
  <text x="40" y="78" class="s m">세는 것은 Addressables가 하지만, '언제 줄일지(Release)'는 사람이 직접 써야 한다. 스코프 층은 '이제 필요 없다'는 신호를 refCount 감소로 번역한다</text>

  <!-- 왼쪽 -->
  <rect x="40" y="104" width="540" height="410" rx="14" class="p-red"/>
  <text x="62" y="140" class="h2 c-red">Addressables만으로</text>
  <rect x="80" y="164" width="460" height="48" rx="8" class="card"/><text x="310" y="194" class="s mid">팝업을 모두 닫았다</text>
  <path d="M310 212 V244" class="ln-m" marker-end="url(#r3)"/>
  <text x="330" y="236" class="s c-red b">✕ 신호를 내려보낼 층이 없다</text>
  <rect x="80" y="250" width="460" height="48" rx="8" class="card"/><text x="310" y="280" class="s mid">Addressables refCount = 2 (그대로)</text>
  <path d="M310 298 V330" class="ln-m" marker-end="url(#r3)"/>
  <rect x="80" y="336" width="460" height="48" rx="8" fill="#ffe3e3" stroke="#e03131"/><text x="310" y="366" class="s mid c-red b">메모리에 남는다</text>
  <text x="62" y="424" class="s">해제하려면 <tspan class="b">호출부 130곳</tspan>이 각자</text>
  <text x="62" y="450" class="s">'언제 Release를 부를지'를 기억해야 한다</text>
  <text x="62" y="484" class="xs m">한 곳이라도 빠지면 새고, 두 번 부르면 다른 쪽이 깨진다</text>

  <!-- 오른쪽 -->
  <rect x="620" y="104" width="540" height="410" rx="14" class="p-green"/>
  <text x="642" y="140" class="h2 c-green">수명 스코프를 한 층 두면</text>
  <rect x="660" y="164" width="460" height="48" rx="8" class="card"/><text x="890" y="194" class="s mid">팝업을 모두 닫았다 (스택 1 → 0)</text>
  <path d="M890 212 V236" class="ln-m" marker-end="url(#r3)"/>
  <rect x="660" y="240" width="460" height="48" rx="8" class="card"/><text x="890" y="270" class="s mid"><tspan class="mono xs">ResourceScope.Dispose()</tspan> — 이 스코프가 쥔 키 전부 −1</text>
  <path d="M890 288 V312" class="ln-m" marker-end="url(#r3)"/>
  <rect x="660" y="316" width="460" height="48" rx="8" class="card"/><text x="890" y="346" class="s mid">Registry refCount 1 → 0 (남은 스코프 없음)</text>
  <path d="M890 364 V388" class="ln-m" marker-end="url(#r3)"/>
  <rect x="660" y="392" width="460" height="48" rx="8" fill="#d3f9d8" stroke="#2b8a3e"/><text x="890" y="422" class="s mid c-green b"><tspan class="mono xs">Addressables.Release</tspan> — 회수</text>
  <text x="642" y="476" class="s">해제 짝맞춤 지점 = <tspan class="b">수명 경계의 개수</tspan></text>
  <text x="642" y="500" class="xs m">(씬 전환 · 팝업 스택 0 · 파티 해체)</text>

  <!-- 결론 -->
  <rect x="40" y="532" width="1120" height="52" rx="12" fill="#1f3a5f"/>
  <text x="600" y="565" class="s w mid"><tspan class="b">Addressables</tspan> = 몇 번 로드했나 (몇 개의 스코프가 쥐었나)   |   <tspan class="b">수명 스코프</tspan> = 언제 줄일지</text>
</svg>

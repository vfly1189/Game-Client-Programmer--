<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640">
  <defs>
    <marker id="n3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6270"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#fff"/>
  <text x="40" y="46" class="h1">Funnel + Bezier — 코너 꼭짓점 V를 기준으로 곡선을 만든다</text>
  <text x="40" y="78" class="s m">Funnel로 '어디서 꺾이는지(코너)'를 찾고, Bezier로 '어떻게 돌지'를 정한다. 곡선의 한가운데가 코너에서 정확히 몸 반경 r만큼 떨어진다</text>

  <!-- 작도 -->
  <rect x="40" y="104" width="680" height="510" rx="14" class="panel"/>
  <rect x="60" y="124" width="640" height="470" fill="#fff"/>
  <path d="M60 340 H460 V594 H60 Z" fill="#ced4da"/>
  <text x="180" y="480" class="s m mid">벽</text>
  <!-- 줄인 통로 -->
  <path d="M60 280 H520 V594" fill="none" stroke="#adb5bd" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="66" y="272" class="xs m">통로를 R만큼 줄인 경계</text>
  <!-- Funnel 경로 -->
  <polyline points="90,250 520,280 560,580" fill="none" stroke="#f59f00" stroke-width="2.4"/>
  <circle cx="520" cy="280" r="6" fill="#f59f00"/>
  <text x="440" y="318" class="xs end" style="fill:#e67700">Funnel 꺾인 점 (버림)</text><line x1="444" y1="312" x2="514" y2="284" stroke="#e67700" stroke-width="1.2"/>
  <!-- 진입 · 진출 직선과 A -->
  <line x1="90" y1="230" x2="580" y2="230" stroke="#4f74c9" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="580" y1="230" x2="580" y2="590" stroke="#4f74c9" stroke-width="1.4" stroke-dasharray="4 4"/>
  <circle cx="580" cy="230" r="7" fill="#4f74c9"/><text x="594" y="222" class="s b c-blue">A</text>
  
  <!-- d -->
  <circle cx="373" cy="230" r="6" fill="#2b8a3e"/><text x="373" y="214" class="xs mid c-green b">곡선 시작</text>
  <circle cx="580" cy="437" r="6" fill="#2b8a3e"/><text x="596" y="442" class="xs c-green b">곡선 끝</text>
  <path d="M378 196 H575" fill="none" stroke="#5b6270" stroke-width="1.2" marker-start="url(#n3)" marker-end="url(#n3)"/>
  <text x="476" y="190" class="xs mid m">d</text>
  <path d="M664 236 V432" fill="none" stroke="#5b6270" stroke-width="1.2" marker-start="url(#n3)" marker-end="url(#n3)"/>
  <text x="674" y="340" class="xs m">d</text>
  <!-- 곡선 -->
  <path d="M90 230 H373 Q580 230 580 437 V590" fill="none" stroke="#2b8a3e" stroke-width="4"/>
  <!-- V 와 r -->
  <circle cx="460" cy="340" r="7" fill="#e03131"/><text x="446" y="362" class="s b c-red end">V (코너)</text>
  <circle cx="528.3" cy="281.7" r="40" fill="#1f3a5f" fill-opacity=".12" stroke="#1f3a5f" stroke-width="1.6"/>
  <circle cx="528.3" cy="281.7" r="4" fill="#1f3a5f"/>
  <line x1="528.3" y1="281.7" x2="500" y2="310" stroke="#1f3a5f" stroke-width="1.6"/>
  <line x1="566" y1="292" x2="594" y2="300" stroke="#1f3a5f" stroke-width="1.2"/><text x="598" y="306" class="xs c-navy b">몸 반경 r</text>
  <!-- R -->
  <path d="M470 340 V 286" fill="none" stroke="#5b6270" stroke-width="1.2" marker-start="url(#n3)" marker-end="url(#n3)"/>
  <text x="478" y="322" class="xs m">R</text>
  <circle cx="90" cy="230" r="8" fill="#1f3a5f"/><text x="90" y="214" class="s b mid">S 쪽</text>
  <text x="572" y="610" class="s b end">G 쪽 ↓</text>

  <!-- 단계 -->
  <rect x="740" y="104" width="420" height="510" rx="14" class="card"/>
  <text x="762" y="140" class="h3">① 통로를 R만큼 줄여 Funnel</text>
  <text x="762" y="166" class="xs">벽 쪽 통로 끝을 R = 1.5r 만큼 줄인다</text>
  <text x="762" y="188" class="xs">→ 경로가 V에서 R 떨어진 곳에서 꺾인다</text>
  <text x="762" y="210" class="xs m">A* 통로에서 꺾이는 벽 꼭짓점 = 코너를 직접 찾음</text>
  <line x1="762" y1="230" x2="1138" y2="230" class="ln"/>
  <text x="762" y="262" class="h3">② 꺾인 점 대신 새 점 A</text>
  <text x="762" y="288" class="xs">Funnel이 낸 꺾인 점은 버리고,</text>
  <text x="762" y="310" class="xs">진입 · 진출 방향으로 A를 정한다</text>
  <line x1="762" y1="330" x2="1138" y2="330" class="ln"/>
  <text x="762" y="362" class="h3">③ A 앞뒤로 곡선</text>
  <text x="762" y="388" class="xs">A 앞뒤 직선 위 d 지점 = 곡선 시작 · 끝</text>
  <text x="762" y="410" class="xs">A는 곡선을 당기기만 하고 지나지 않는다</text>
  <text x="762" y="432" class="xs">(2차 Bezier의 제어점)</text>
  <rect x="762" y="452" width="376" height="144" rx="10" class="p-green"/>
  <text x="778" y="480" class="s b c-green">d를 정하는 조건</text>
  <text x="778" y="506" class="xs">곡선 한가운데 = A + d/4 · (진출 − 진입 방향)</text>
  <text x="778" y="530" class="xs">이 점이 V에서 정확히 r → d가 하나로 정해진다</text>
  <text x="778" y="562" class="xs b">→ 벽에서 몸 반경만큼 띄운 채,</text>
  <text x="778" y="584" class="xs b">코너를 가깝고 둥글게 돈다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#fff"/>
  <text x="40" y="46" class="h1">결과 — 상주 메모리는 줄고, 씬을 오가도 다시 쌓이지 않는다</text>
  <text x="40" y="78" class="s m">같은 경로 · 같은 체크포인트에서 Before / After 측정. 호출부에 추가한 Release는 0줄</text>

  <g>
    <rect x="40" y="100" width="266" height="120" rx="12" class="card"/>
    <text x="173" y="130" class="xs mid b c-red">Global 상주 메모리 (진입 직후)</text>
    <text x="173" y="172" class="h1 mid"><tspan class="c-orange">513</tspan> → <tspan class="c-blue">205MB</tspan></text>
    <text x="173" y="204" class="s mid b c-green">▼60%</text>
    <rect x="324" y="100" width="266" height="120" rx="12" class="card"/>
    <text x="457" y="130" class="xs mid b c-red">전체 리소스 메모리 (진입 직후)</text>
    <text x="457" y="172" class="h1 mid"><tspan class="c-orange">617</tspan> → <tspan class="c-blue">363MB</tspan></text>
    <text x="457" y="204" class="s mid b c-green">▼41%</text>
    <rect x="608" y="100" width="266" height="120" rx="12" class="card"/>
    <text x="741" y="130" class="xs mid b c-red">던전 왕복 후 남는 메모리</text>
    <text x="741" y="172" class="h1 mid"><tspan class="c-orange">+18.7</tspan> → <tspan class="c-blue">≈0MB</tspan></text>
    <text x="741" y="204" class="s mid b c-green">쌓이지 않음</text>
    <rect x="892" y="100" width="268" height="120" rx="12" class="card"/>
    <text x="1026" y="130" class="xs mid b m">대가 : 팝업 첫 오픈</text>
    <text x="1026" y="172" class="h1 mid c-orange">+14 ~ 20ms</text>
    <text x="1026" y="204" class="s mid m">다시 열 때는 그대로</text>
  </g>

  <!-- 차트 -->
  <rect x="40" y="240" width="680" height="340" rx="14" class="panel"/>
  <text x="62" y="272" class="h3">개발 빌드 실측 — 텍스처 메모리 (MB)</text>
  <g stroke="#e9ecef"><path d="M110 520 H690 M110 470 H690 M110 420 H690 M110 370 H690 M110 320 H690"/></g>
  <g class="xs m end"><text x="102" y="524">120</text><text x="102" y="474">135</text><text x="102" y="424">150</text><text x="102" y="374">165</text><text x="102" y="324">180</text></g>
  <polyline points="160,451.0 285,357.3 410,357.3 535,446.3 660,446.3" fill="none" stroke="#3b5bdb" stroke-width="3"/>
  <g fill="#3b5bdb"><circle cx="160" cy="451.0" r="6"/><circle cx="285" cy="357.3" r="6"/><circle cx="410" cy="357.3" r="6"/><circle cx="535" cy="446.3" r="6"/><circle cx="660" cy="446.3" r="6"/></g>
  <g class="xs mid b"><text x="160" y="435">140.7</text><text x="285" y="345">168.8</text><text x="410" y="345">168.8</text><text x="535" y="432">142.1</text><text x="660" y="432">142.1</text></g>
  <g class="xs m mid"><text x="160" y="546">진입</text><text x="285" y="546">팝업 5종 첫 오픈</text><text x="410" y="546">다시 열기</text><text x="535" y="546">던전 왕복 후</text><text x="660" y="546">종료</text></g>
  <text x="246" y="424" class="xs c-orange b mid">+28.1</text>
  <text x="456" y="436" class="xs c-green b mid">−26.7</text>

  <!-- 설명 -->
  <rect x="740" y="240" width="420" height="340" rx="14" class="card"/>
  <text x="762" y="274" class="h3 c-red">실제 빌드에서 확인한 것</text>
  <text x="762" y="312" class="s b">1. 팝업을 열면 +28.1MB</text>
  <text x="776" y="338" class="xs">팝업 프리팹 · 슬롯은 <tspan class="b">Scene 스코프</tspan>에 등록</text>
  <text x="776" y="358" class="xs m">(스탠딩 같은 대형 콘텐츠만 Popup 스코프)</text>
  <text x="762" y="398" class="s b">2. 씬을 오가면 −26.7MB 반납</text>
  <text x="776" y="424" class="xs">Scene 스코프 소멸 → refCount 자동 정산</text>
  <text x="762" y="464" class="s b">3. 다시 열고 · 다시 오가도 그대로</text>
  <text x="776" y="490" class="xs">재오픈 0MB (캐시 hit) · 왕복 후 증가 0MB</text>
  <line x1="762" y1="512" x2="1138" y2="512" class="ln"/>
  <text x="762" y="540" class="xs m">풀은 원본 프리팹의 refCount 티켓을 직접 잡아</text>
  <text x="762" y="560" class="xs m">실측 ref 1 → 3 → 1 (Global · Scene · 풀 티켓)</text>
</svg>

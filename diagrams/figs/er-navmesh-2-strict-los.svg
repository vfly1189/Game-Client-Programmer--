<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#fff"/>
  <text x="40" y="46" class="h1">시도 — 같은 규칙 그대로, 판정만 엄격하게 하면?</text>
  <text x="40" y="78" class="s m">직선이 A* 통로 삼각형 안에만 있어야 통과하도록 바꿨다. 끼임은 사라졌지만, 후보가 여전히 삼각형 중심점이라 중심점에서 급하게 꺾였다</text>

  <rect x="40" y="104" width="620" height="470" rx="14" class="panel"/>
  <rect x="60" y="124" width="580" height="430" fill="#ced4da"/>
  <path d="M60 124 H640 V554 H420 V300 H60 Z" fill="#fff"/>
  <g stroke="#dee2e6" stroke-width="1.2" fill="none">
    <path d="M60 124 L200 300 L200 124 L340 300 L340 124 L420 300 L500 124 L640 230 L420 300 L640 380 L420 430 L640 554 M500 124 L420 300 M640 230 L640 380 M420 430 L640 380 M420 554 L420 430"/>
  </g>
  <text x="250" y="420" class="s m mid">벽 (NavMesh 밖)</text>
  <polyline points="96,200 150,250 200,180 270,250 340,180 410,220 500,190 560,270 520,330 580,400 520,450 560,520" fill="none" stroke="#f59f00" stroke-width="2" opacity=".55"/>
  <!-- 최단 경로 -->
  <polyline points="96,200 420,300 560,520" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="7 6"/>
  <!-- 엄격 LOS -->
  <polyline points="96,200 500,190 560,520" fill="none" stroke="#15aabf" stroke-width="3.4"/>
  <circle cx="500" cy="190" r="7" fill="#15aabf"/>
  <path d="M470 191 A 30 30 0 0 1 505 220" fill="none" stroke="#e03131" stroke-width="2.4"/>
  <text x="514" y="174" class="s b c-red">86° 꺾임</text>
  <text x="440" y="242" class="xs m">중심점</text>
  <circle cx="96" cy="200" r="9" fill="#1f3a5f"/><text x="96" y="186" class="s b mid">S</text>
  <circle cx="560" cy="520" r="9" fill="#1f3a5f"/><text x="580" y="526" class="s b">G</text>
  <g class="xs">
    <line x1="62" y1="600" x2="90" y2="600" stroke="#f59f00" stroke-width="3" opacity=".6"/><text x="96" y="604">A* 경로</text>
    <line x1="170" y1="600" x2="198" y2="600" stroke="#15aabf" stroke-width="3"/><text x="204" y="604">엄격한 LOS 경로</text>
    <line x1="330" y1="600" x2="358" y2="600" stroke="#868e96" stroke-width="2" stroke-dasharray="6 5"/><text x="364" y="604">최단 경로</text>
  </g>

  <rect x="680" y="104" width="480" height="470" rx="14" class="card"/>
  <text x="702" y="140" class="h3">규칙은 같고, 판정만 바뀌었다</text>
  <rect x="702" y="158" width="210" height="96" rx="10" class="p-red"/>
  <text x="718" y="186" class="s b c-red">후한 판정</text>
  <text x="718" y="212" class="xs">근처면 통과</text>
  <text x="718" y="234" class="xs">P6 ✓ (벽 안이어도)</text>
  <rect x="928" y="158" width="210" height="96" rx="10" class="p-blue"/>
  <text x="944" y="186" class="s b c-blue">엄격한 판정</text>
  <text x="944" y="212" class="xs">통로 삼각형 안만 통과</text>
  <text x="944" y="234" class="xs">P6 ✕ → P5 ✓</text>
  <g class="s">
    <text x="702" y="296">끼임</text><text x="1138" y="296" class="end b c-green">93쌍 → 0</text>
    <text x="702" y="328">최대 회전</text><text x="1138" y="328" class="end b c-red">78.6° → 86.1°</text>
    <text x="702" y="360">스무딩 1회</text><text x="1138" y="360" class="end b">16.4ms → 11μs</text>
  </g>
  <line x1="702" y1="380" x2="1138" y2="380" class="ln"/>
  <text x="702" y="414" class="s b">왜 여전히 부자연스러운가</text>
  <text x="702" y="442" class="xs">판정을 바꿔도 건너뛸 후보는 <tspan class="b">삼각형 중심점</tspan>뿐이다</text>
  <text x="702" y="466" class="xs">중심점은 코너가 어디 있는지 모른다 → 코너에서 먼 점에서 꺾인다</text>
  <rect x="702" y="490" width="436" height="64" rx="10" class="p-orange"/>
  <text x="718" y="518" class="s b c-orange">목표는 최단이 아니라 자연스러운 이동</text>
  <text x="718" y="542" class="xs">→ 코너를 직접 찾아서, 가깝고 둥글게 돌아야 한다</text>
</svg>

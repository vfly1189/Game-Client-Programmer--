<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690">
  <defs>
    <marker id="s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6270"/></marker>
  </defs>
  <rect width="1200" height="690" fill="#fff"/>
  <text x="40" y="46" class="h1">흐름은 Timeline 위에, 행동은 그 순간에만 — 같은 '유물 포격'을 SkillSystem으로</text>
  <text x="40" y="78" class="s m">흐름 = 애니메이션 · Timeline + 태그 신호, 행동 = Event 하나. 신호가 오면 태그와 칠판(memo) 조건이 맞는 Task만 Event를 실행한다</text>

  <!-- 층 이름 -->
  <g>
    <rect x="40" y="110" width="150" height="50" rx="8" fill="#1f3a5f"/><text x="115" y="134" class="s w mid b">수명</text><text x="115" y="152" class="xs w mid">PatternRunner</text>
    <rect x="40" y="176" width="150" height="50" rx="8" fill="#4f74c9"/><text x="115" y="200" class="s w mid b">흐름</text><text x="115" y="218" class="xs w mid">TimelineAction</text>
    <rect x="40" y="254" width="150" height="50" rx="8" fill="#5c7cfa"/><text x="115" y="278" class="s w mid b">신호 → 반응</text><text x="115" y="296" class="xs w mid">TagMarker · PatternTask</text>
    <rect x="40" y="352" width="150" height="50" rx="8" fill="#e8590c"/><text x="115" y="376" class="s w mid b">행동</text><text x="115" y="394" class="xs w mid">PatternEvent</text>
    <rect x="40" y="446" width="150" height="50" rx="8" fill="#2b8a3e"/><text x="115" y="470" class="s w mid b">칠판</text><text x="115" y="488" class="xs w mid">PatternMemo</text>
  </g>
  <!-- 수명 -->
  <rect x="210" y="110" width="950" height="50" rx="8" fill="#1f3a5f"/>
  <text x="230" y="141" class="s w">패턴 시작 (memo 비움)</text>
  <text x="685" y="141" class="s w mid">Runner.Tick — 현재 Action 진행 · 사망 / 회수 시 Cancel</text>
  <text x="1140" y="141" class="s w end">끝 → PatternEnded</text>
  <!-- 흐름 -->
  <rect x="210" y="176" width="950" height="50" rx="8" fill="#dbe4ff" stroke="#4f74c9"/>
  <text x="226" y="207" class="s c-navy b">Timeline 재생</text>
  <path d="M340 201 H1140" stroke="#4f74c9" stroke-width="2"/>
  <g>
    <rect x="352" y="186" width="90" height="30" rx="15" fill="#f59f00"/><text x="397" y="206" class="s mid b">Cast</text>
    <rect x="690" y="186" width="90" height="30" rx="15" fill="#f59f00"/><text x="735" y="206" class="s mid b">Strike</text>
    <rect x="1040" y="186" width="90" height="30" rx="15" fill="#f59f00"/><text x="1085" y="206" class="s mid b">End</text>
  </g>
  <path d="M397 216 V250" class="ln-m" marker-end="url(#s2)"/>
  <path d="M735 216 L640 250 M735 216 L830 250" class="ln-m"/>
  <path d="M1085 216 V250" class="ln-m" marker-end="url(#s2)"/>
  <!-- Task -->
  <rect x="300" y="254" width="194" height="58" rx="8" class="card"/>
  <text x="397" y="278" class="s mid b">Task : Cast</text><text x="397" y="300" class="xs m mid">태그 Cast</text>
  <rect x="546" y="254" width="188" height="58" rx="8" class="card"/>
  <text x="640" y="278" class="s mid b">Task : 빨강이면</text><text x="640" y="300" class="xs m mid">태그 Strike · memo 색 == 빨강</text>
  <rect x="742" y="254" width="188" height="58" rx="8" class="card"/>
  <text x="836" y="278" class="s mid b">Task : 초록이면</text><text x="836" y="300" class="xs m mid">태그 Strike · memo 색 == 초록</text>
  <rect x="988" y="254" width="194" height="58" rx="8" class="card"/>
  <text x="1085" y="278" class="s mid b">Task : End</text><text x="1085" y="300" class="xs m mid">태그 End</text>
  <path d="M397 312 V348 M640 312 V348 M836 312 V348 M1085 312 V348" class="ln-m" marker-end="url(#s2)"/>
  <!-- Event -->
  <rect x="270" y="352" width="254" height="70" rx="8" fill="#e8590c"/>
  <text x="397" y="378" class="s w mid b">ChooseEvent · ActivationEvent</text><text x="397" y="402" class="xs w mid">색 고르기 · 유물 켜기 · 경고</text>
  <rect x="546" y="352" width="188" height="70" rx="8" fill="#e8590c"/>
  <text x="640" y="378" class="s w mid b">StrikeEvent</text><text x="640" y="402" class="xs w mid">낙뢰 · 안쪽</text>
  <rect x="742" y="352" width="188" height="70" rx="8" fill="#e8590c"/>
  <text x="836" y="378" class="s w mid b">StrikeEvent</text><text x="836" y="402" class="xs w mid">낙뢰 · 바깥</text>
  <rect x="988" y="352" width="194" height="70" rx="8" fill="#e8590c"/>
  <text x="1085" y="378" class="s w mid b">ActivationEvent</text><text x="1085" y="402" class="xs w mid">유물 끄기</text>
  <!-- memo -->
  <rect x="210" y="446" width="950" height="50" rx="8" class="p-green"/>
  <text x="226" y="477" class="s c-green b">이번 패턴 동안만</text>
  <rect x="352" y="456" width="150" height="30" rx="6" fill="#fff" stroke="#2b8a3e"/><text x="427" y="476" class="xs mid">색 = 빨강</text>
  <path d="M397 422 V454" stroke="#2b8a3e" stroke-width="1.6" marker-end="url(#s2)"/><text x="404" y="442" class="xs c-green">쓰기</text>
  <path d="M536 454 V290 H544" fill="none" stroke="#2b8a3e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#s2)"/><text x="530" y="440" class="xs c-green end">읽기</text>
  <path d="M958 454 V290 H932" fill="none" stroke="#2b8a3e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#s2)"/><text x="966" y="440" class="xs c-green">읽기</text>
  <rect x="560" y="456" width="200" height="30" rx="6" fill="#fff" stroke="#2b8a3e"/><text x="660" y="476" class="xs mid">경고 위치 = P1 … P8</text>

  <!-- 규칙 -->
  <rect x="40" y="520" width="370" height="146" rx="12" class="card"/>
  <text x="58" y="550" class="h3">Action은 상태를 가져도 된다</text>
  <text x="58" y="578" class="xs">한 번에 하나만 돈다 (Runner가 순서대로)</text>
  <text x="58" y="606" class="h3">Event는 무상태</text>
  <text x="58" y="634" class="xs">같은 Event가 겹쳐 Fire될 수 있다 — 값은 ctx · memo로</text>
  <rect x="424" y="520" width="370" height="146" rx="12" class="card"/>
  <text x="442" y="550" class="h3">분기는 '부품'이 아니라 '조건'</text>
  <text x="442" y="578" class="xs">빨강 / 초록은 새 클래스가 아니라</text>
  <text x="442" y="600" class="xs">Task의 memo 조건 두 줄이다</text>
  <text x="442" y="634" class="xs m">새 분기 종류 → Timeline 신호 + Task 조건</text>
  <rect x="808" y="520" width="352" height="146" rx="12" class="card"/>
  <text x="826" y="550" class="h3">신호 입구는 SkillSystem 밖에</text>
  <text x="826" y="578" class="xs">Timeline 마커 → TimelineTagReceiver</text>
  <text x="826" y="600" class="xs">애니 이벤트 → AnimationTagReceiver</text>
  <text x="826" y="634" class="xs m">SS는 Unity 전달 방식을 모르고 SendTag만 받는다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640">
  <rect width="1200" height="640" fill="#fff"/>
  <text x="40" y="46" class="h1">처음 생각 — 플레이어가 들어간 구역(Sector)의 스포너만 켠다</text>
  <text x="40" y="78" class="s m">구역마다 Trigger Collider를 두고 진입 · 탈출로 켜고 끈다 → 켜고 끄는 단위가 '구역' 하나라서, 경계에서 문제가 생긴다</text>

  <!-- 왼쪽 : 맵 도식 -->
  <rect x="40" y="104" width="650" height="510" rx="14" class="panel"/>
  <text x="62" y="136" class="h3">플레이어가 Sector 3 → 4 경계에 섰을 때</text>
  <!-- 구역 -->
  <rect x="64" y="160" width="200" height="380" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.4"/>
  <rect x="264" y="160" width="200" height="380" fill="#fff3bf" stroke="#f59f00" stroke-width="2"/>
  <rect x="464" y="160" width="200" height="380" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.4"/>
  <text x="164" y="186" class="s m mid b">Sector 2 · 꺼짐</text>
  <text x="364" y="186" class="s mid b" style="fill:#b35c00">Sector 3 · 켜짐</text>
  <text x="564" y="186" class="s m mid b">Sector 4 · 꺼짐</text>
  <!-- 화면(카메라) -->
  <rect x="364" y="292" width="190" height="118" rx="6" fill="none" stroke="#1f3a5f" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="370" y="286" class="xs c-navy b">화면</text>
  <!-- 켜진 몬스터 (Sector 3) -->
  <g fill="#e8590c">
    <circle cx="292" cy="214" r="7"/><circle cx="330" cy="246" r="7"/><circle cx="296" cy="300" r="7"/>
    <circle cx="300" cy="462" r="7"/><circle cx="346" cy="500" r="7"/><circle cx="410" cy="476" r="7"/>
    <circle cx="430" cy="214" r="7"/><circle cx="384" cy="232" r="7"/><circle cx="318" cy="380" r="7"/>
    <circle cx="404" cy="372" r="7"/><circle cx="436" cy="318" r="7"/>
  </g>
  <!-- 꺼진 스포너 (Sector 4 / 2) -->
  <g fill="none" stroke="#868e96" stroke-width="2">
    <circle cx="520" cy="226" r="7"/><circle cx="604" cy="262" r="7"/><circle cx="560" cy="470" r="7"/>
    <circle cx="630" cy="420" r="7"/><circle cx="612" cy="338" r="7"/><circle cx="514" cy="500" r="7"/>
    <circle cx="120" cy="240" r="7"/><circle cx="200" cy="300" r="7"/><circle cx="150" cy="430" r="7"/><circle cx="220" cy="480" r="7"/>
  </g>
  <!-- 플레이어 -->
  <circle cx="466" cy="352" r="11" fill="#1f3a5f"/>
  <text x="466" y="386" class="xs c-navy mid b">플레이어</text>
  <!-- ① 따라오던 몬스터 -->
  <circle cx="436" cy="352" r="7" fill="#e03131"/>
  <path d="M428 344 L444 360 M444 344 L428 360" stroke="#fff" stroke-width="2.4"/>
  <!-- 배지 -->
  <g class="badge">
    <circle cx="420" cy="430" r="13" fill="#e03131"/><text x="420" y="435" class="xs w mid b">1</text>
    <line x1="426" y1="420" x2="434" y2="362" stroke="#e03131" stroke-width="1.6"/>
    <circle cx="282" cy="240" r="13" fill="#e03131"/><text x="282" y="245" class="xs w mid b">2</text>
    <circle cx="590" cy="300" r="13" fill="#e03131"/><text x="590" y="305" class="xs w mid b">3</text>
    <circle cx="464" cy="566" r="13" fill="#e03131"/><text x="464" y="571" class="xs w mid b">4</text>
    <line x1="464" y1="553" x2="464" y2="540" stroke="#e03131" stroke-width="1.6"/>
    <text x="484" y="571" class="xs c-red">구역 경계는 사람이 직접 그린다</text>
  </g>
  <circle cx="82" cy="598" r="6" fill="#e8590c"/><text x="94" y="603" class="xs m">켜진 몬스터</text>
  <circle cx="190" cy="598" r="6" fill="none" stroke="#868e96" stroke-width="2"/><text x="202" y="603" class="xs m">꺼진 스포너</text>
  <rect x="290" y="591" width="22" height="14" fill="none" stroke="#1f3a5f" stroke-width="1.6" stroke-dasharray="4 3"/><text x="320" y="603" class="xs m">화면</text>

  <!-- 오른쪽 : 문제 4가지 -->
  <g>
    <rect x="714" y="104" width="446" height="114" rx="12" class="card"/>
    <circle cx="746" cy="140" r="15" fill="#e03131"/><text x="746" y="146" class="s w mid b">1</text>
    <text x="772" y="146" class="h3">따라오던 몬스터가 사라짐</text>
    <text x="772" y="176" class="s m">경계를 넘어 Sector 3이 꺼지면,</text>
    <text x="772" y="200" class="s m">싸우던 몬스터도 즉시 풀로 회수된다</text>

    <rect x="714" y="230" width="446" height="114" rx="12" class="card"/>
    <circle cx="746" cy="266" r="15" fill="#e03131"/><text x="746" y="272" class="s w mid b">2</text>
    <text x="772" y="272" class="h3">멀어도 같은 구역이면 켜짐</text>
    <text x="772" y="302" class="s m">구역 안이면 거리와 상관없이 켜져서,</text>
    <text x="772" y="326" class="s m">켜 둔 몬스터 대부분이 <tspan class="c-red b">화면 밖</tspan>에 있다</text>

    <rect x="714" y="356" width="446" height="114" rx="12" class="card"/>
    <circle cx="746" cy="392" r="15" fill="#e03131"/><text x="746" y="398" class="s w mid b">3</text>
    <text x="772" y="398" class="h3">경계를 넘는 순간 몰림</text>
    <text x="772" y="428" class="s m">옆 구역의 스포너가 한 프레임에 전부 켜져</text>
    <text x="772" y="452" class="s m">한 번에 <tspan class="c-red b">최대 119마리</tspan>가 생성된다</text>

    <rect x="714" y="482" width="446" height="132" rx="12" class="card"/>
    <circle cx="746" cy="518" r="15" fill="#e03131"/><text x="746" y="524" class="s w mid b">4</text>
    <text x="772" y="524" class="h3">맵마다 구역을 손으로 나눔</text>
    <text x="772" y="554" class="s m">구역 분할과 스포너 배정을</text>
    <text x="772" y="578" class="s m">맵을 만들 때마다 다시 해야 한다</text>
  </g>
</svg>
